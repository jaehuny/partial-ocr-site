<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>부분 OCR · 필요한 곳만 글자 인식</title>
  <script type="module" crossorigin src="./assets/index-yZn-Mv8O.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-3q_I4yF7.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">✂︎</span><div><h1>부분 OCR</h1><p>필요한 영역만 골라서 글자를 인식해요. 파일은 이 브라우저 밖으로 나가지 않아요.</p></div></div>
  <div class="actions">
    <label class="btn primary" for="file">PDF · 이미지 열기</label>
    <input id="file" type="file" accept="application/pdf,image/*" hidden />
    <button id="modeBtn" class="btn" disabled title="모바일에서 스크롤과 영역 그리기를 전환">✏️ 그리기 모드</button>
    <button id="ocrBtn" class="btn accent" disabled>선택 영역 인식</button>
    <button id="exportBtn" class="btn" disabled>PDF 받기</button>
  </div>
</header>
<main>
  <section id="viewer" class="viewer">
    <div id="drop" class="drop">
      <div class="drop-inner">
        <div class="big">📄</div>
        <h2>PDF나 이미지를 여기에 끌어다 놓으세요</h2>
        <p>페이지 위에서 <b>드래그</b>해서 인식할 영역을 상자로 지정하세요. 여러 페이지, 여러 영역 모두 가능해요.</p>
      </div>
    </div>
    <div id="pages"></div>
  </section>
  <aside class="panel">
    <div class="panel-head"><h2>선택한 영역 <span id="count" class="pill">0</span></h2><button id="clearBtn" class="link" disabled>모두 지우기</button></div>
    <fieldset class="modes"><legend>PDF로 받을 때</legend>
      <label><input type="radio" name="exportMode" value="replace" checked /> 글자 바꿔서 보이게 <small>(영역을 흰 바탕+고친 글자로 덮어요)</small></label>
      <label><input type="radio" name="exportMode" value="invisible" /> 원본 유지+검색용 <small>(보이지 않는 글자만 넣어요)</small></label>
    </fieldset>
    <div id="status" class="status">파일을 열면 시작할 수 있어요.</div>
    <ol id="regions" class="regions"></ol>
  </aside>
</main>
<button id="toResults" class="btn primary fab">📝 인식 결과·수정 ↓</button>
</body>
</html>
